name: Deploy Mintlify Docs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Mintlify
        uses: mintlify/mintlify-action@v1
        with:
          api-key: ${{ secrets.MINTLIFY_API_KEY }}
